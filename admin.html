<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">

</head>
<body>
<nav class="menu-bar">
  <div class="menu-brand">Admin</div>
</nav>
<div class="sheet">

  <!-- PLAYERS -->
  <div class="panel players-panel">
    <div class="bl"></div><div class="br"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div class="eyebrow" style="margin-bottom:0;">Players <span class="player-count" id="playerCount"></span></div>
      <div class="slot-controls">
        <button type="button" class="slot-btn panel-collapse-btn" onclick="togglePanelCollapse(this)" title="Collapse section">👁</button>
        <button type="button" class="slot-btn" id="playerRemoveBtn" onclick="showSlotPicker(event, this, 'playerGrid', '.player-title', 'Player')" title="Remove a Player">−</button>
        <button type="button" class="slot-btn" onclick="addPlayerSection()" title="Add a Player">+</button>
      </div>
    </div>
    <div class="player-grid" id="playerGrid">
    </div>
  </div>

</div>

<div id="slotPicker" class="preset-menu"></div>

<script src="tech-presets.js"></script>
<script>
  var TECH_TYPES = [
    {key:'offense', icon:'⚔', label:'Offense'},
    {key:'defense', icon:'🛡', label:'Defense'},
    {key:'movement', icon:'➤', label:'Movement'},
    {key:'science', icon:'⚛︎', label:'Science'}
  ];
  var TECH_STATE_ORDER = ['hand','played','exhausted','trashed'];
  var DEPLOY_STATES = [
    {key:'normal', icon:'◉', label:'Normal', svg:''},
    {key:'deployable', icon:'⍙', label:'Deployable', svg:'<svg class="kw-icon" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="4" stroke="var(--icon-amber)" stroke-width="1.6"/><circle cx="8" cy="8" r="1.4" fill="var(--icon-amber)"/><circle cx="16" cy="8" r="1.4" fill="var(--icon-amber)"/><circle cx="12" cy="12" r="1.4" fill="var(--icon-amber)"/><circle cx="8" cy="16" r="1.4" fill="var(--icon-amber)"/><circle cx="16" cy="16" r="1.4" fill="var(--icon-amber)"/></svg>'},
    {key:'module', icon:'⬡', label:'Module', svg:'<svg class="kw-icon" viewBox="0 0 24 24" fill="none"><path d="M12 2.5 21 8v8l-9 5.5L3 16V8l9-5.5Z" stroke="var(--icon-cyan)" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.6" stroke="var(--icon-cyan)" stroke-width="1.6"/></svg>'}
  ];
  function presetDeployTag(p){
    var meta = p.deploy === 'module' ? DEPLOY_STATES[2] : (p.deploy ? DEPLOY_STATES[1] : null);
    if(!meta || !meta.svg) return '';
    return '<span class="preset-tag preset-deploy">' + meta.svg + '</span>';
  }
  function presetStorageTag(p){
    var st = parseInt(p.storage, 10);
    if(isNaN(st) || st <= 0) return '';
    return '<span class="preset-tag preset-storage"><svg viewBox="0 0 24 24" fill="none"><path d="M4 8h16v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8Z" stroke="var(--icon-amber)" stroke-width="1.8" stroke-linejoin="round"/><path d="M2 8h20l-2-4H4L2 8Z" stroke="var(--icon-amber)" stroke-width="1.8" stroke-linejoin="round"/></svg>' + st + '</span>';
  }
  function buildTechPresetMenu(panel){
    var menu = panel.querySelector('.tech-preset-menu');
    menu.innerHTML = '';
    var importItem = document.createElement('button');
    importItem.type = 'button';
    importItem.className = 'preset-item';
    importItem.textContent = '[Import]';
    importItem.onclick = function(){
      closeTechPresetMenus();
      importTechToPanel(panel);
    };
    menu.appendChild(importItem);
    var blank = document.createElement('button');
    blank.type = 'button';
    blank.className = 'preset-item';
    blank.textContent = 'Blank';
    blank.onclick = function(){
      addTechToPanel(panel, null);
      closeTechPresetMenus();
    };
    menu.appendChild(blank);
    var sorted = TECH_PRESETS.slice().sort(function(a,b){return a.name.toLowerCase().localeCompare(b.name.toLowerCase());});
    for(var i=0;i<sorted.length;i++){
      (function(p){
        var item = document.createElement('button');
        item.type = 'button';
        item.className = 'preset-item';
        var label = document.createElement('span');
        label.textContent = p.name;
        if((p.traits || '').indexOf('Class Tech') !== -1) label.className = 'preset-class-tech';
        item.appendChild(label);
        item.innerHTML += presetDeployTag(p);
        item.innerHTML += presetStorageTag(p);
        item.innerHTML += '<span class="preset-tag preset-type">' + techTypeMeta(p.tt).icon + '</span>';
        var ft = item.querySelector('.preset-tag');
        if(ft) ft.style.marginLeft = 'auto';
        item.onclick = function(){
          addTechToPanel(panel, p);
          closeTechPresetMenus();
        };
        menu.appendChild(item);
      })(sorted[i]);
    }
  }
  function toggleTechPresetMenu(e, btn){
    e.stopPropagation();
    closeSlotPicker();
    var menu = btn.nextElementSibling;
    var open = menu.classList.contains('open');
    closeTechPresetMenus();
    if(!open) menu.classList.add('open');
  }
  function closeTechPresetMenus(){
    var menus = document.querySelectorAll('.tech-preset-menu.open');
    for(var i=0;i<menus.length;i++){
      menus[i].classList.remove('open');
    }
  }
  document.addEventListener('click', function(e){
    closeTechPresetMenus();
  });
  function addTechToPanel(panel, p){
    var grid = panel.querySelector('.tech-grid');
    addTechSlot(grid);
    var card = grid.lastElementChild;
    if(!p) return;
    card.querySelector('.tname').value = p.name || '';
    card.querySelector('.ttraits').value = p.traits || '';
    card.querySelector('.tsec.onbuild textarea').value = p.onbuild || '';
    card.querySelector('.tsec.passive textarea').value = p.passive || '';
    card.querySelector('.tsec.onactivate textarea').value = p.onactivate || '';
    card.querySelector('.tstorage-input').value = (p.storage !== undefined && p.storage !== null) ? p.storage : '';
    card.querySelector('.thull-input').value = (p.hull !== undefined && p.hull !== null) ? p.hull : '';
    card.querySelector('.tcharges-input').value = (p.charges !== undefined && p.charges !== null) ? p.charges : '';
    card.querySelector('.tcost-onbuild').value = (p.onbuildenergy !== undefined && p.onbuildenergy !== null) ? p.onbuildenergy : '';
    card.querySelector('.tcost-onactivate').value = (p.onactivateenergy !== undefined && p.onactivateenergy !== null) ? p.onactivateenergy : '';
    setTechType(card.querySelector('.tticker'), p.tt);
    setTechDeploy(card.querySelector('.tdepbtn'), p.deploy);
    refreshTechSections(card);
  }
  function importTechToPanel(panel){
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json,.json';
    input.onchange = function(){
      var file = input.files[0];
      if(!file) return;
      var baseName = (file.name || '').replace(/\.[^.]+$/, '').trim();
      var reader = new FileReader();
      reader.onload = function(e){
        try{
          var json = JSON.parse(e.target.result);
          var tech = json && Array.isArray(json.tech) ? json.tech : null;
          if(!tech){
            alert('Import failed: no "tech" section found in file.');
            return;
          }
          if(baseName){
            var nameInput = panel.querySelector('.player-title');
            if(nameInput) nameInput.value = baseName;
          }
          writeTechToPanel(panel, tech);
          alert('Imported ' + tech.length + ' technologie(s).');
        }catch(err){
          alert('Import failed: invalid JSON file.');
        }
      };
      reader.readAsText(file);
    };
    input.click();
  }
  function writeTechToPanel(panel, tech){
    var grid = panel.querySelector('.tech-grid');
    var count = Array.isArray(tech) ? tech.length : 1;
    var target = Math.max(1, count);
    while(grid.children.length < target) addTechSlot(grid);
    while(grid.children.length > target) grid.removeChild(grid.lastElementChild);
    for(var i = 0; i < grid.children.length; i++){
      var card = grid.children[i];
      var item = (tech && tech[i]) ? tech[i] : {};
      card.querySelector('.tname').value = item.name || '';
      card.querySelector('.ttraits').value = item.traits || '';
      card.querySelector('.tsec.onbuild textarea').value = item.onbuild || '';
      card.querySelector('.tsec.passive textarea').value = item.passive || '';
      card.querySelector('.tsec.onactivate textarea').value = item.onactivate || '';
      card.querySelector('.tcost-onbuild').value = item.onbuildenergy || '';
      card.querySelector('.tcost-onactivate').value = item.onactivateenergy || '';
      card.querySelector('.tstorage-input').value = item.storage || '';
      card.querySelector('.thull-input').value = item.hull || '';
      card.querySelector('.tcharges-input').value = item.charges || '';
      setTechType(card.querySelector('.tticker'), item.techType);
      setTechDeploy(card.querySelector('.tdepbtn'), item.deploy);
      var state = 'played';
      if(item.state !== undefined && item.state !== null && item.state !== ''){
        state = item.state;
      } else if(item.exhaust === true){
        state = 'exhausted';
      } else if(item.built === false){
        state = 'hand';
      }
      if(!isTechState(state)) state = 'played';
      setTechState(card, state);
      refreshTechSections(card);
    }
  }
  function techTypeMeta(key){
    for(var i=0;i<TECH_TYPES.length;i++){ if(TECH_TYPES[i].key===key) return TECH_TYPES[i]; }
    return TECH_TYPES[0];
  }
  function labelNum(n){ return '0' + n; }

  /* ===== collapse (as in frigate.html) ===== */
  function togglePanelCollapse(btn){
    var panel = btn.closest('.panel');
    if(!panel) return;
    panel.classList.toggle('collapsed');
  }

  /* ===== Players sections ===== */
  function addPlayerSection(){
    var grid = document.getElementById('playerGrid');
    var n = grid.children.length + 1;
    var panel = document.createElement('div');
    panel.className = 'panel player-panel';
    panel.innerHTML =
      '<div class="bl"></div><div class="br"></div>' +
      '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">' +
        '<div class="eyebrow" style="margin-bottom:0;">' +
          '<span class="player-index">' + labelNum(n) + '</span>' +
          '<input class="player-title" type="text" placeholder="PLAYER NAME" maxlength="30">' +
        '</div>' +
        '<div class="slot-controls">' +
          '<button type="button" class="slot-btn panel-collapse-btn" onclick="togglePanelCollapse(this)" title="Collapse section">👁</button>' +
          '<button type="button" class="slot-btn techRemoveBtn" onclick="showSlotPicker(event, this, \'techGrid\', \'.tname\', \'Technology\')" title="Remove a Technology">−</button>' +
          '<div class="slot-menu-wrap">' +
            '<button type="button" class="slot-btn" onclick="toggleTechPresetMenu(event, this)" title="Add Technology">+</button>' +
            '<div class="preset-menu tech-preset-menu"></div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="tech-grid" style="margin-top:12px;"></div>';
    grid.appendChild(panel);
    addTechSlot(panel.querySelector('.tech-grid'));
    buildTechPresetMenu(panel);
    refreshPlayerControls();
  }
  function removePlayerAt(idx){
    var grid = document.getElementById('playerGrid');
    if(grid.children.length <= 1) return;
    var panel = grid.children[idx];
    if(panel) grid.removeChild(panel);
    relabelPlayers();
    refreshPlayerControls();
  }
  function relabelPlayers(){
    var grid = document.getElementById('playerGrid');
    var spans = grid.querySelectorAll('.player-index');
    for(var i=0;i<spans.length;i++){
      spans[i].textContent = labelNum(i + 1);
    }
  }
  function refreshPlayerControls(){
    var grid = document.getElementById('playerGrid');
    var count = grid.children.length;
    document.getElementById('playerRemoveBtn').disabled = count <= 1;
    document.getElementById('playerCount').textContent = '(' + count + ')';
  }

  /* ===== Technology cards ===== */
  function removeTechCard(btn){
    var card = btn.closest('.tech-card');
    if(!card) return;
    var grid = card.parentNode;
    if(grid.children.length <= 1) addTechSlot(grid);
    grid.removeChild(card);
  }
  function addTechSlot(grid){
    var card = document.createElement('div');
    card.className = 'tech-card';
    card.setAttribute('data-state', 'played');
    card.innerHTML = techCardHTML();
    grid.appendChild(card);
    refreshTechSections(card);
    syncTechStateUI(card);
  }
  function techCardHTML(){
    return '' +
      '<div class="thead"><input class="tname" placeholder="TECH NAME"><button type="button" class="tbuilt-btn" data-state="played" onclick="toggleTechState(this)" title="Cycle state: hand / played / exhausted / trash">⇅</button><button type="button" class="t-delete" onclick="removeTechCard(this)" title="Delete this tech">🗑</button><button type="button" class="tsecedit" onclick="toggleTechEdit(this)" title="Edit sections">Edit</button></div>' +
      '<div class="tsub"><input class="ttraits" placeholder="TRAITS"></div>' +
      '<div class="tsecs">' +
        '<div class="tsec onbuild hid"><div class="tsec-head"><span>On Play</span><span class="tdiamond" title="On Play energy"><svg class="ticon" viewBox="0 0 24 24" fill="none"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" stroke="var(--icon-energy)" stroke-width="1.8" stroke-linejoin="round"/></svg><input class="tcost-onbuild" maxlength="2"></span></div><textarea placeholder="On Play..."></textarea></div>' +
        '<div class="tsec passive hid"><div class="tsec-head"><span>Passive</span></div><textarea placeholder="Passive..."></textarea></div>' +
        '<div class="tsec onactivate hid"><div class="tsec-head"><span>On Activate</span><span class="tdiamond" title="On Activate energy"><svg class="ticon" viewBox="0 0 24 24" fill="none"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" stroke="var(--icon-energy)" stroke-width="1.8" stroke-linejoin="round"/></svg><input class="tcost-onactivate" maxlength="2"></span></div><textarea placeholder="On Activate..."></textarea></div>' +
      '</div>' +
      '<div class="tfoot">' +
        '<span class="tticker" data-tt="offense" title="Tech type: Offense" onclick="cycleTechType(this)">⚔</span>' +
        '<span class="tstorage" title="Storage cost"><svg class="ticon" viewBox="0 0 24 24" fill="none"><path d="M4 8h16v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8Z" stroke="var(--icon-amber)" stroke-width="1.8" stroke-linejoin="round"/><path d="M2 8h20l-2-4H4L2 8Z" stroke="var(--icon-amber)" stroke-width="1.8" stroke-linejoin="round"/></svg><input class="tstorage-input" maxlength="3"></span>' +
        '<span class="thull hid" title="Hull"><svg class="ticon" viewBox="0 0 24 24" fill="none"><path d="M12 2 4 5v6c0 5 3.4 8.4 8 11 4.6-2.6 8-6 8-11V5l-8-3Z" stroke="var(--icon-shield)" stroke-width="1.8" stroke-linejoin="round"/></svg><input class="thull-input" maxlength="4"></span>' +
        '<span class="tcharges hid" title="Charges"><svg class="ticon" viewBox="0 0 24 24" fill="none"><rect x="2" y="7" width="16" height="10" rx="2.5" stroke="var(--icon-charged)" stroke-width="1.8"/><path d="M21 10.5v3" stroke="var(--icon-charged)" stroke-width="1.8" stroke-linecap="round"/><path d="M6 10.5v3M10 10.5v3M14 10.5v3" stroke="var(--icon-charged)" stroke-width="1.8" stroke-linecap="round"/></svg><input class="tcharges-input" maxlength="4"></span>' +
        '<span class="tdepbtn" data-deploy="normal" title="Deploy: Normal" onclick="cycleTechDeploy(this)">◉</span>' +
      '</div>';
  }
  function isTechState(s){ return TECH_STATE_ORDER.indexOf(s) !== -1; }
  function techState(card){
    var s = card ? (card.getAttribute('data-state') || 'played') : 'played';
    if(!isTechState(s)) s = 'played';
    return s;
  }
  function setTechState(card, state){
    if(!card) return;
    if(!isTechState(state)) state = 'played';
    card.setAttribute('data-state', state);
    syncTechStateUI(card);
  }
  function syncTechStateUI(card){
    if(!card) return;
    card.classList.remove('state-hand','state-played','state-exhausted','state-trashed');
    card.classList.add('state-' + techState(card));
    var btn = card.querySelector('.tbuilt-btn');
    if(btn){
      btn.setAttribute('data-state', techState(card));
      btn.textContent = (techState(card) === 'hand') ? '🂱' : '⇅';
    }
  }
  function toggleTechState(btn){
    var card = btn.closest ? btn.closest('.tech-card') : null;
    if(!card) return;
    var cur = techState(card);
    var next = TECH_STATE_ORDER[(TECH_STATE_ORDER.indexOf(cur) + 1) % TECH_STATE_ORDER.length];
    setTechState(card, next);
  }
  function setTechType(el, key){
    var meta = techTypeMeta(key);
    el.setAttribute('data-tt', meta.key);
    el.textContent = meta.icon;
    el.title = 'Tech type: ' + meta.label;
  }
  function cycleTechType(el){
    var keys = TECH_TYPES.map(function(t){return t.key;});
    var idx = keys.indexOf(el.getAttribute('data-tt'));
    var next = keys[(idx + 1) % keys.length];
    setTechType(el, next);
  }
  function setTechDeploy(el, state){
    var idx = 0;
    if(typeof state === 'boolean'){ idx = state ? 1 : 0; }
    else if(typeof state === 'number'){ idx = state; }
    else {
      var s = String(state);
      if(s === 'true'){ idx = 1; }
      else if(s === 'false' || s === ''){ idx = 0; }
      else if(s === '1' || s === '2'){ idx = parseInt(s,10); }
      else { for(var i=0;i<DEPLOY_STATES.length;i++){ if(DEPLOY_STATES[i].key===s){ idx=i; break; } } }
    }
    idx = ((idx % DEPLOY_STATES.length)+DEPLOY_STATES.length)%DEPLOY_STATES.length;
    var meta = DEPLOY_STATES[idx];
    el.setAttribute('data-deploy', meta.key);
    if(meta.svg){ el.innerHTML = meta.svg; }
    else { el.textContent = meta.icon; }
    el.title = meta.label;
    el.classList.toggle('on', meta.key !== 'normal');
  }
  function cycleTechDeploy(el){
    var cur = 0;
    for(var i=0;i<DEPLOY_STATES.length;i++){ if(DEPLOY_STATES[i].key===el.getAttribute('data-deploy')){ cur=i; break; } }
    setTechDeploy(el, (cur + 1) % DEPLOY_STATES.length);
  }
  function refreshTechSections(card){
    if(!card) return;
    var editing = card.classList.contains('editing');
    var secs = card.querySelectorAll('.tsec');
    for(var i=0;i<secs.length;i++){
      var field = secs[i].querySelector('textarea');
      var hasText = field && field.value.trim() !== '';
      var diamond = secs[i].querySelector('.tdiamond');
      var hasCost = diamond && !!diamond.querySelector('input') && diamond.querySelector('input').value.trim() !== '';
      if(secs[i].classList.contains('onbuild')){
        secs[i].classList.toggle('hid', !hasText && !hasCost && !editing);
      } else {
        secs[i].classList.toggle('hid', !hasText && !editing);
      }
      if(field){
        field.disabled = !editing;
        if(secs[i].classList.contains('onbuild')){
          field.placeholder = editing ? 'On Play...' : '';
        }
      }
      if(diamond){
        var inp = diamond.querySelector('input');
        var hasVal = inp && inp.value.trim() !== '';
        diamond.classList.toggle('hid', !hasVal && !editing);
      }
      var secText = field ? field.value : '';
      var hasMod = /create\s+module/i.test(secText);
      var hasDep = /create\s+deployable/i.test(secText);
      secs[i].classList.toggle('dep', hasDep);
      secs[i].classList.toggle('mod', hasMod && !hasDep);
    }
    var traits = card.querySelector('.ttraits');
    if(traits){
      traits.classList.toggle('hid', traits.value.trim() === '' && !editing);
      traits.disabled = !editing;
    }
    var tname = card.querySelector('.tname');
    if(tname){ tname.disabled = !editing; }
    var storage = card.querySelector('.tstorage');
    if(storage){
      var sInp = storage.querySelector('.tstorage-input');
      var sVal = sInp ? parseInt(sInp.value,10) : 0;
      var isZero = isNaN(sVal) || sVal === 0;
      storage.classList.toggle('hid', isZero && !editing);
      if(sInp) sInp.disabled = !editing;
    }
    var hull = card.querySelector('.thull');
    if(hull){
      var hInp = hull.querySelector('.thull-input');
      var hEmpty = !hInp || hInp.value.trim() === '';
      hull.classList.toggle('hid', hEmpty && !editing);
      if(hInp) hInp.disabled = !editing;
    }
    var charges = card.querySelector('.tcharges');
    if(charges){
      var cInp = charges.querySelector('.tcharges-input');
      var cEmpty = !cInp || cInp.value.trim() === '';
      charges.classList.toggle('hid', cEmpty && !editing);
      if(cInp) cInp.disabled = !editing;
    }
    var diamonds = card.querySelectorAll('.tdiamond input');
    for(var d=0; d<diamonds.length; d++){
      diamonds[d].disabled = !editing;
    }
  }
  function toggleTechEdit(btn){
    var card = btn.closest('.tech-card');
    card.classList.toggle('editing');
    btn.textContent = card.classList.contains('editing') ? 'Done' : 'Edit';
    refreshTechSections(card);
  }

  /* ===== slot picker (remove which one, as in frigate.html) ===== */
  function gridFor(target, gridId){
    if(gridId === 'playerGrid') return document.getElementById(gridId);
    if(gridId === 'techGrid') return target.closest('.player-panel').querySelector('.tech-grid');
    return null;
  }
  function showSlotPicker(e, btn, gridId, nameSel, label){
    e.stopPropagation();
    closeTechPresetMenus();
    var grid = gridFor(btn, gridId);
    if(!grid || grid.children.length <= 1) return;
    var menu = document.getElementById('slotPicker');
    menu._gridId = gridId;
    menu._btn = btn;
    menu.innerHTML = '';
    var title = document.createElement('div');
    title.className = 'slot-picker-title';
    title.textContent = 'Remove which ' + (label || 'slot') + '?';
    menu.appendChild(title);
    function displayFor(gridId, i){
      if(gridId === 'playerGrid'){
        var tr = grid.children[i].querySelector('.player-title');
        var name = tr && tr.value.trim();
        if(name) return name;
        var idx = grid.children[i].querySelector('.player-index');
        return 'Player ' + (idx ? idx.textContent : labelNum(i+1));
      }
      var nameEl = grid.children[i].querySelector(nameSel);
      var n = ((nameEl && nameEl.value.trim()) ? nameEl.value.trim() : '');
      if(n) return n;
      return labelNum(i + 1);
    }
    for(var i = 0; i < grid.children.length; i++){
      var item = document.createElement('button');
      item.type = 'button';
      item.className = 'preset-item';
      var span = document.createElement('span');
      span.textContent = '#' + (i + 1) + '  ' + displayFor(gridId, i);
      item.appendChild(span);
      item.onclick = (function(idx){
        return function(){
          deleteSlotAt(idx);
          closeSlotPicker();
        };
      })(i);
      menu.appendChild(item);
    }
    var r = btn.getBoundingClientRect();
    menu.style.left = r.left + 'px';
    menu.style.top = (r.bottom + 6) + 'px';
    menu.classList.add('open');
  }
  function deleteSlotAt(idx){
    var menu = document.getElementById('slotPicker');
    var gridId = menu._gridId;
    var btn = menu._btn;
    var grid = gridFor(btn, gridId);
    if(!grid) return;
    if(gridId === 'techGrid'){
      if(grid.children.length <= 1) addTechSlot(grid);
      if(grid.children[idx]) grid.removeChild(grid.children[idx]);
    } else {
      removePlayerAt(idx);
    }
  }
  function closeSlotPicker(){
    document.getElementById('slotPicker').classList.remove('open');
  }
  document.addEventListener('click', function(e){
    var menu = document.getElementById('slotPicker');
    if(menu.classList.contains('open') && !menu.contains(e.target)){
      closeSlotPicker();
    }
  });

  window.addEventListener('DOMContentLoaded', function(){
    addPlayerSection();
    refreshPlayerControls();
  });
</script>
</body>
</html>
